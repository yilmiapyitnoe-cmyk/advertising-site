<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdVibe - Discover & Earn</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: white;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #6b7280;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 13px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .section {
      padding: 45px 6%;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 28px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #6b7280;
      line-height: 1.5;
    }

    .ad-box {
      margin: 30px auto;
      max-width: 728px;
      min-height: 120px;
      background: #e5e7eb;
      border: 2px dashed #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }
